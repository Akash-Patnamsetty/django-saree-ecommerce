<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Dashboard{% endblock %} | Gnapika</title>
  <style>
    body { margin:0; background:#0b0b0b; color:#eee; font-family:Arial,sans-serif; }
    .top { display:flex; flex-wrap:wrap; justify-content:space-between; align-items:center;
           padding:14px 24px; background:#111; border-bottom:1px solid rgba(212,175,55,.25); }
    .brand { color:#D4AF37; letter-spacing:4px; font-weight:700; text-decoration:none; }
    .brand span { color:#888; font-size:12px; letter-spacing:2px; margin-left:8px; }
    .top nav a { color:#ddd; text-decoration:none; margin-left:18px; font-size:14px; }
    .top nav a:hover { color:#D4AF37; }
    main { max-width:1100px; margin:24px auto; padding:0 16px; }
    h1 { color:#D4AF37; font-size:22px; }
    .msg { padding:10px 14px; border-radius:8px; margin-bottom:14px; font-size:14px; }
    .msg.success { background:rgba(34,197,94,.12); border:1px solid #22c55e; color:#6ee7a0; }
    .msg.error { background:rgba(239,68,68,.12); border:1px solid #ef4444; color:#ff8a8a; }
    table { width:100%; border-collapse:collapse; background:#141414; border-radius:10px; overflow:hidden; }
    th, td { padding:10px 12px; text-align:left; border-bottom:1px solid #222; font-size:14px; }
    th { color:#D4AF37; font-weight:600; background:#1a1a1a; }
    td img { width:48px; height:60px; object-fit:cover; border-radius:6px; }
    .btn { display:inline-block; padding:7px 14px; border-radius:8px; border:none; cursor:pointer;
           font-size:13px; text-decoration:none; color:#111; background:#D4AF37; }
    .btn.danger { background:#ef4444; color:#fff; }
    .btn.ghost { background:transparent; color:#D4AF37; border:1px solid #D4AF37; }
    input, select, textarea { width:100%; padding:10px; margin:6px 0 14px; box-sizing:border-box;
           background:#1a1a1a; color:#fff; border:1px solid #333; border-radius:8px; }
    label { font-size:13px; color:#bbb; }
    .card { background:#141414; border:1px solid #222; border-radius:12px; padding:22px; }
    .row { display:flex; gap:10px; flex-wrap:wrap; align-items:center; }
    .thumbs { display:flex; gap:12px; flex-wrap:wrap; margin-bottom:14px; }
    .thumbs div { text-align:center; font-size:12px; color:#aaa; }
    .thumbs img { width:90px; height:110px; object-fit:cover; border-radius:8px; border:1px solid #333; display:block; }
  </style>
</head>
<body>
  <header class="top">
    <a class="brand" href="{% url 'dashboard_home' %}">GNAPIKA <span>DASHBOARD</span></a>
    <nav>
     <a href="{% url 'dashboard_account' %}">My Account</a>
      <a href="{% url 'dashboard_home' %}">Products</a>
      <a href="{% url 'dashboard_categories' %}">Categories</a>
      <a href="{% url 'dashboard_upload' %}">Add Product / Category</a>
      {% if request.current_user.role == 'admin' %}
  <a href="{% url 'dashboard_staff' %}">Staff</a>
{% endif %}
      <a href="{% url 'home' %}">View Shop</a>
      <a href="{% url 'logout' %}">Logout</a>
    </nav>
  </header>
  <main>
    {% for m in messages %}<div class="msg {{ m.tags }}">{{ m }}</div>{% endfor %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>
