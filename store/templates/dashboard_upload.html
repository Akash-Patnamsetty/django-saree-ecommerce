{% extends "dashboard_base.html" %}
{% block title %}Add Product / Category{% endblock %}
{% block content %}
<h1>Add new</h1>
<div class="row" style="align-items:flex-start; gap:24px;">

  <form class="card" method="post" enctype="multipart/form-data" style="flex:1; min-width:300px;">
    {% csrf_token %}
    <input type="hidden" name="form_type" value="category">
    <h2 style="margin-top:0; font-size:17px; color:#D4AF37;">Add category</h2>

    <label>Category name</label>
    <input type="text" name="category_name" maxlength="100" required>

    <label>Category image</label>
    <input type="file" name="category_image" accept="image/*">

    <button class="btn" type="submit">Add category</button>
  </form>

  <form class="card" method="post" enctype="multipart/form-data" style="flex:2; min-width:320px;">
    {% csrf_token %}
    <input type="hidden" name="form_type" value="product">
    <h2 style="margin-top:0; font-size:17px; color:#D4AF37;">Add product</h2>

    <label>Title</label>
    <input type="text" name="title" value="{{ form.title }}" maxlength="255" required>

    <label>Description</label>
    <textarea name="description" rows="4">{{ form.description }}</textarea>

    <div class="row">
      <div style="flex:1; min-width:130px;"><label>Price</label>
        <input type="number" step="0.01" min="0.01" name="price" value="{{ form.price }}" required></div>
      <div style="flex:1; min-width:130px;"><label>Old price (optional)</label>
        <input type="number" step="0.01" min="0.01" name="old_price" value="{{ form.old_price }}"></div>
      <div style="flex:1; min-width:130px;"><label>Stock</label>
        <input type="number" min="0" name="stock" value="{{ form.stock }}" required></div>
    </div>

    <label>Category</label>
    <select name="category" required>
      <option value="">-- Select category --</option>
      {% for cat in categories %}
      <option value="{{ cat.category_id }}" {% if form.category == cat.category_id|stringformat:"s" %}selected{% endif %}>{{ cat.name }}</option>
      {% endfor %}
    </select>

    <label>Main image (required)</label>
    <input type="file" name="main_image" accept="image/*" required>

    <label>Extra images</label>
    <input type="file" name="extra_images" id="extra_images" accept="image/*" multiple>
    <div id="preview" class="thumbs" style="margin-top:6px;"></div>

    <small style="color:#888;">Images are not kept if the form shows an error, so you will need to choose them again.</small><br><br>
    <div class="row">
      <button class="btn" type="submit">Add product</button>
      <a class="btn ghost" href="{% url 'dashboard_home' %}">Cancel</a>
    </div>
  </form>
</div>

<script>
let allFiles = [];
document.getElementById("extra_images").addEventListener("change", function () {
  const preview = document.getElementById("preview");
  Array.from(this.files).forEach(file => {
    allFiles.push(file);
    const reader = new FileReader();
    reader.onload = e => {
      const wrap = document.createElement("div");
      const img = document.createElement("img");
      img.src = e.target.result;
      wrap.appendChild(img);
      preview.appendChild(wrap);
    };
    reader.readAsDataURL(file);
  });
  const dt = new DataTransfer();
  allFiles.forEach(f => dt.items.add(f));
  this.files = dt.files;
});
</script>
{% endblock %}
