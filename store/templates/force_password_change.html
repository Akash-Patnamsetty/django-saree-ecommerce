<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Change Password | Gnapika</title>

  <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      background: #050505;
      color: #f3f3f3;
      font-family: Arial, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
    }

    .card {
      background: #0f0f0f;
      border: 1px solid rgba(212,175,55,.2);
      border-radius: 24px;
      padding: 36px;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 15px 50px rgba(0,0,0,.4);
    }

    h1 {
      color: #D4AF37;
      letter-spacing: 4px;
      font-size: 25px;
      text-align: center;
      margin: 0 0 8px;
    }

    p.sub {
      text-align: center;
      color: #888;
      font-size: 13px;
      line-height: 1.6;
      margin-bottom: 28px;
    }

    .input-group {
      position: relative;
      margin-bottom: 18px;
    }

    .input-group input {
      width: 100%;
      padding: 14px 46px 14px 14px;
      border-radius: 12px;
      border: 1px solid rgba(212,175,55,.25);
      background: rgba(255,255,255,.04);
      color: #fff;
      font-size: 14px;
      outline: none;
      transition: border-color .3s, box-shadow .3s;
    }

    .input-group input:focus {
      border-color: #D4AF37;
      box-shadow: 0 0 12px rgba(212,175,55,.10);
    }

    .input-group input::placeholder {
      color: #777;
    }

    .toggle-password {
      position: absolute;
      right: 15px;
      top: 50%;
      transform: translateY(-50%);
      color: #888;
      cursor: pointer;
      transition: color .2s;
      padding: 5px;
    }

    .toggle-password:hover {
      color: #D4AF37;
    }

    button[type="submit"] {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      background: linear-gradient(135deg,#D4AF37,#B8963E);
      color: #111;
      font-weight: 800;
      font-size: 13px;
      letter-spacing: 2px;
      margin-top: 8px;
      transition: all .3s ease;
    }

    button[type="submit"]:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 22px rgba(212,175,55,.2);
    }

    .err {
      color: #ff6b6b;
      background: rgba(255,107,107,.07);
      border: 1px solid rgba(255,107,107,.2);
      border-radius: 10px;
      padding: 11px;
      font-size: 13px;
      margin-bottom: 16px;
    }

    .password-hint {
      color: #777;
      font-size: 11px;
      line-height: 1.6;
      margin: -8px 0 18px;
    }

    @media (max-width: 480px) {
      .card {
        padding: 28px 22px;
        border-radius: 20px;
      }
    }
  </style>
</head>

<body>
  <form class="card" method="post">
    {% csrf_token %}

    <h1>GNAPIKA</h1>
    <p class="sub">Set a new password to keep your account secure.</p>

    {% if error %}
      <div class="err">{{ error }}</div>
    {% endif %}

    <div class="input-group">
      <input
        type="password"
        id="new_password"
        name="new_password"
        placeholder="New password"
        autocomplete="new-password"
        required
      >
      <i
        class="fa-solid fa-eye toggle-password"
        onclick="togglePassword('new_password', this)"
        role="button"
        tabindex="0"
        aria-label="Show new password"
        aria-pressed="false"
      ></i>
    </div>

    <div class="input-group">
      <input
        type="password"
        id="confirm_password"
        name="confirm_password"
        placeholder="Confirm new password"
        autocomplete="new-password"
        required
      >
      <i
        class="fa-solid fa-eye toggle-password"
        onclick="togglePassword('confirm_password', this)"
        role="button"
        tabindex="0"
        aria-label="Show confirm password"
        aria-pressed="false"
      ></i>
    </div>

    <p class="password-hint">
      Choose a strong password that you haven't used before.
    </p>

    <button type="submit">SAVE PASSWORD</button>
  </form>

  <script>
    function togglePassword(inputId, icon) {
      const input = document.getElementById(inputId);
      const isHidden = input.type === "password";

      input.type = isHidden ? "text" : "password";

      icon.classList.toggle("fa-eye", !isHidden);
      icon.classList.toggle("fa-eye-slash", isHidden);

      icon.setAttribute(
        "aria-label",
        isHidden ? "Hide password" : "Show password"
      );

      icon.setAttribute("aria-pressed", String(isHidden));
    }

    document.querySelectorAll(".toggle-password").forEach(icon => {
      icon.addEventListener("keydown", function(event) {
        if (event.key === "Enter" || event.key === " ") {
          event.preventDefault();
          togglePassword(
            this.previousElementSibling ? this.previousElementSibling.id :
            this.parentElement.querySelector("input").id,
            this
          );
        }
      });
    });
  </script>
</body>
</html>
